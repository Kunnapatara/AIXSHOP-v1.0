name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Lint, Test, and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Security dependency audit (high/critical)
        run: bun audit --audit-level=high

      - name: Static security checks (no client Bearer auth or hardcoded live secrets)
        run: |
          if grep -rnE 'sk_live_[A-Za-z0-9]{16,}|whsec_[A-Za-z0-9]{16,}' src/ ; then
            echo "ERROR: Potential hardcoded live Stripe secret detected in src/"
            exit 1
          fi
          if grep -rnE "headers\['Authorization'\]\s*=" src/api/client.ts ; then
            echo "ERROR: Browser API client must remain cookie-only without Authorization headers"
            exit 1
          fi

      - name: Type check (Lint)
        run: bun run lint

      - name: Run test suite
        run: bun run test

      - name: Generate signed simulated test artifact & verify HMAC/SHA-256 report integrity
        run: |
          bun run verify:simulated -- --skip-markdown --json-out=/tmp/commercial-report.json
          bun -e '
            const fs = require("node:fs");
            const report = JSON.parse(fs.readFileSync("/tmp/commercial-report.json", "utf8"));
            if (!report.simulatedArtifactRunId) throw new Error("Missing simulatedArtifactRunId");
            if (!Array.isArray(report.simulatedChecks) || report.simulatedChecks.length !== 4) {
              throw new Error("Expected 4 simulated checks in commercial report");
            }
            for (const c of report.simulatedChecks) {
              if (c.status !== "PASS — SIMULATED") {
                throw new Error(`Simulated check ${c.testId} expected PASS — SIMULATED, got ${c.status}: ${c.blockerOrFailure || ""}`);
              }
              if (c.evidence?.hmacVerified !== true) {
                throw new Error(`Simulated check ${c.testId} missing verified HMAC flag`);
              }
              if (c.evidence?.sha256Verified !== true || !/^[0-9a-f]{64}$/.test(c.evidence?.sha256 || "")) {
                throw new Error(`Simulated check ${c.testId} missing verified SHA-256 evidence`);
              }
              if (!/^[0-9a-f]{64}$/.test(c.evidence?.outputSha256 || "")) {
                throw new Error(`Simulated check ${c.testId} missing captured output SHA-256 digest`);
              }
            }
            if (report.overallExternalStatus !== "BLOCKED") {
              throw new Error(`Expected overallExternalStatus BLOCKED without external secrets, got ${report.overallExternalStatus}`);
            }
            const rawArtifact = fs.readFileSync("reports/simulated-test-results.json", "utf8");
            if (!JSON.parse(rawArtifact).hmacSha256) {
              throw new Error("Expected root hmacSha256 in simulated artifact");
            }
          '

      - name: Secret-safe config check
        run: bun run config:check

      - name: Production build
        run: bun run build

  postgres-integration:
    name: Live PostgreSQL Migrations & Multi-Connection Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aixshop
          POSTGRES_PASSWORD: aixshop_ci_password
          POSTGRES_DB: aixshop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aixshop -d aixshop_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://aixshop:aixshop_ci_password@localhost:5432/aixshop_test
      SHOPIFY_TOKEN_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply PostgreSQL migrations 001-019
        run: bun run db:migrate

      - name: Verify migration checksums and readiness
        run: bun run db:status

      - name: Run full suite including live PostgreSQL integration tests
        run: bun run test

      - name: Type check (Lint)
        run: bun run lint

      - name: Production build
        run: bun run build

  browser-e2e:
    name: Browser & Mobile E2E (Playwright Chromium)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright browser and mobile E2E tests
        run: bun run test:e2e:browser
