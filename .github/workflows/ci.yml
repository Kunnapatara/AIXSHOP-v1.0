name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Lint, Test, and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check (Lint)
        run: bun run lint

      - name: Run test suite
        run: bun run test

      - name: Production build
        run: bun run build

  postgres-integration:
    name: Live PostgreSQL Migrations & Multi-Connection Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aixshop
          POSTGRES_PASSWORD: aixshop_ci_password
          POSTGRES_DB: aixshop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://aixshop:aixshop_ci_password@localhost:5432/aixshop_test
      SHOPIFY_TOKEN_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply PostgreSQL migrations 001-012
        run: bun run db:migrate

      - name: Verify migration checksums and readiness
        run: bun run db:status

      - name: Run full suite including live PostgreSQL integration tests
        run: bun run test

      - name: Type check (Lint)
        run: bun run lint

      - name: Production build
        run: bun run build
